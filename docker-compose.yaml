services:
  stable-audio-controlnet:
    build: .
    container_name: stable-audio-controlnet
    volumes:
      - .:/app
      - /Volumes:/Volumes
    environment:
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN}
    tty: true
    stdin_open: true

  gui:
    build:
      context: .
      dockerfile: gui/Dockerfile
    container_name: stable-audio-controlnet-gui
    ports:
      - "7860:7860"
    volumes:
      - .:/app
      - /Volumes:/Volumes
      - ./ckpts:/app/ckpts
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN}
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    restart: unless-stopped

  gui-gpu:
    build:
      context: .
      dockerfile: gui/Dockerfile
    container_name: stable-audio-controlnet-gui-gpu
    ports:
      - "7860:7860"
    volumes:
      - .:/app
      - /Volumes:/Volumes
      - ./ckpts:/app/ckpts
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN}
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    profiles: ["gpu"]
