# @package _global_

train: True
sample_rate: 44100
chunk_dur: 47.55446713

log_every_n_steps: 100

model:
  _target_: main.module_controlnet_melody.Model
  lr: 1e-5
  lr_beta1: 0.95
  lr_beta2: 0.999
  lr_eps: 1e-6
  lr_weight_decay: 1e-3
  cfg_dropout_prob: 0.1
  depth_factor: 0.5

datamodule:
  _target_: main.module_controlnet_melody.WebDatasetDatamodule
  train_dataset:
    _target_: main.data.dataset_musdb_melody_cached.create_musdb_dataset_melody_from_cache
    cache_file: /app/data/melody_cache/train_no_vocals_melody.h5
    tar_path: /app/data/musdb18hq/train.tar
    sample_rate: ${sample_rate}
    chunk_dur: ${chunk_dur}
    # 元の実装（毎回メロディ計算）:
    # _target_: main.data.dataset_musdb_melody.create_musdb_dataset_with_melody
    # path: null
    # cqt_bins: 128
    # bins_per_octave: 12
    # topk: 4
    # hpf_cutoff_hz: 261.2
    # magnitude_threshold: 0.1
    # hop_length: null
    # shardshuffle: True

  val_dataset:
    _target_: main.data.dataset_musdb_melody_cached.create_musdb_dataset_melody_from_cache
    cache_file: /app/data/melody_cache/test_ordered_no_vocals_melody.h5
    tar_path: /app/data/musdb18hq/test_ordered.tar
    sample_rate: ${sample_rate}
    chunk_dur: ${chunk_dur}
    # 元の実装（毎回メロディ計算）:
    # _target_: main.data.dataset_musdb_melody.create_musdb_dataset_with_melody
    # path: null
    # cqt_bins: 128
    # bins_per_octave: 12
    # topk: 4
    # hpf_cutoff_hz: 261.2
    # magnitude_threshold: 0.1
    # hop_length: null
    # shardshuffle: False

  shuffle_size: 24
  batch_size_train: 16
  batch_size_val: 1
  collate_fn:
    # _target_: main.data.dataset_musdb_melody.collate_fn_melody_mix
    # _partial_: True
    _target_: main.data.dataset_musdb_melody_cached.collate_fn_genre_melody
    _partial_: True
    csv_path: "/app/data/tracklist.csv"
    drop_vocals: True # 楽器のメロディーを生成する場合
    # drop_vocals: False  # ボーカルのメロディーを生成する場合（歌詞は連続しないので、要検討）
  drop_last: True
  num_workers: 4
  pin_memory: True
  persistent_workers: True
  multiprocessing_context: spawn

callbacks:
  rich_progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar

  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: "valid_loss" # name of the logged metric which determines when model is improving
    save_top_k: 3 # save k best models (determined by above metric)
    save_last: True # additionaly always save model from last epoch
    mode: "min" # can be "max" or "min"
    verbose: False
    dirpath: ${logs_dir}/ckpts/${oc.env:TAG}_${now:%Y-%m-%d-%H-%M-%S}
    filename: "{epoch:02d}-{valid_loss:.3f}"

  model_summary:
    _target_: pytorch_lightning.callbacks.RichModelSummary
    max_depth: 2

  audio_samples_logger:
    _target_: main.module_controlnet_melody.SampleLogger
    sampling_steps: [100]
    cfg_scale: 7.0
    num_samples: 2

loggers:
  wandb:
    _target_: pytorch_lightning.loggers.wandb.WandbLogger
    project: ${oc.env:WANDB_PROJECT}
    entity: ${oc.env:WANDB_ENTITY}
    # offline: False  # set True to store all logs only locally
    job_type: "train"
    group: ""
    save_dir: ${logs_dir}

trainer:
  _target_: pytorch_lightning.Trainer
  devices: 1 # Set `1` to train on GPU, `0` to train on CPU only, and `-1` to train on all GPUs, default `0`
  precision: 16 # Precision used for tensors, default `32`
  accelerator: gpu # `ddp` GPUs train individually and sync gradients, default `None`
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  min_epochs: 0
  max_epochs: -1
  enable_model_summary: False
  log_every_n_steps: 1 # Logs metrics every N batches
  check_val_every_n_epoch: null
  val_check_interval: ${log_every_n_steps}
