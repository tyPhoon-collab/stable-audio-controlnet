# @package _global_

train: True
sample_rate: 44100
chunk_dur: 47.55446713
chord_frame_rate: 4.0

log_every_n_steps: 200

model:
  _target_: main.module_controlnet_chord.Model
  lr: 1e-5
  lr_beta1: 0.95
  lr_beta2: 0.999
  lr_eps: 1e-6
  lr_weight_decay: 1e-3
  cfg_dropout_prob: 0.1
  depth_factor: 0.2
  chord_conditioner:
    _target_: main.chord_conditioner.EmbeddingChordConditioner

datamodule:
  _target_: main.module_controlnet_chord.WebDatasetDatamodule
  train_dataset:
    _target_: main.data.dataset_musdb_chord.create_musdb_dataset_with_chords
    path: /app/data/musdb18hq/train.tar
    sample_rate: ${sample_rate}
    lab_dir: /app/data/musdb_simple_train
    chunk_dur: ${chunk_dur}
    chord_frame_rate: ${chord_frame_rate}
    shardshuffle: True

  val_dataset:
    _target_: main.data.dataset_musdb_chord.create_musdb_dataset_with_chords
    path: /app/data/musdb18hq/test_ordered.tar
    sample_rate: ${sample_rate}
    lab_dir: /app/data/musdb_simple_test
    chunk_dur: ${chunk_dur}
    chord_frame_rate: ${chord_frame_rate}
    shardshuffle: False

  shuffle_size: 24
  batch_size_train: 8
  batch_size_val: 1
  collate_fn:
    # _target_: main.data.dataset_musdb_chord.collate_fn_genre
    _target_: main.data.dataset_musdb_chord.collate_fn_music_prompt
    _partial_: True
    # csv_path: "/app/data/tracklist.csv"
  drop_last: True
  num_workers: 4
  pin_memory: True
  persistent_workers: True
  multiprocessing_context: spawn

callbacks:
  rich_progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar

  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: "valid_loss" # name of the logged metric which determines when model is improving
    save_top_k: 3 # save k best models (determined by above metric)
    save_last: True # additionaly always save model from last epoch
    mode: "min" # can be "max" or "min"
    verbose: False
    dirpath: ${logs_dir}/ckpts/${oc.env:TAG}_${now:%Y-%m-%d-%H-%M-%S}
    filename: "{epoch:02d}-{valid_loss:.3f}"

  model_summary:
    _target_: pytorch_lightning.callbacks.RichModelSummary
    max_depth: 2

  audio_samples_logger:
    _target_: main.module_controlnet_chord.SampleLogger
    sampling_steps: [100]
    cfg_scale: 7.0
    num_samples: 2
    frame_rate: ${chord_frame_rate}

loggers:
  wandb:
    _target_: pytorch_lightning.loggers.wandb.WandbLogger
    project: ${oc.env:WANDB_PROJECT}
    entity: ${oc.env:WANDB_ENTITY}
    # offline: False  # set True to store all logs only locally
    job_type: "train"
    group: ""
    save_dir: ${logs_dir}

trainer:
  _target_: pytorch_lightning.Trainer
  devices: 1 # Set `1` to train on GPU, `0` to train on CPU only, and `-1` to train on all GPUs, default `0`
  precision: 16 # Precision used for tensors, default `32`
  accelerator: gpu # `ddp` GPUs train individually and sync gradients, default `None`
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  min_epochs: 0
  max_epochs: 200
  enable_model_summary: False
  log_every_n_steps: 1 # Logs metrics every N batches
  check_val_every_n_epoch: null
  val_check_interval: ${log_every_n_steps}
