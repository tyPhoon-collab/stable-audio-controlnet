# 優先度高: 主要パラメータの絞り込みスイープ
#
# 最も影響が大きそうなパラメータを少数の組み合わせで検証
# まず、これを実行して方向性を決める
#
# 使用方法:
#   python scripts/sweep_experiments.py --config sweep_configs/priority_sweep.yaml

base_exp: train_musdb_controlnet_chord
base_tag: sweep-priority

parameters:
  # バックボーン: 上位3種のみ
  model.chord_conditioner.backbone._target_:
    - main.chord_backbones.ChordMambaBackbone
    - main.chord_backbones.ChordGRUBackbone

  # 学習率: 2段階
  model.lr:
    - 5e-6
    - 1e-5

eval_params:
  cfg_scale: [7.0]
  steps: [100]
  samples: 50
  batch_size: 16

# 合計: 2 × 2 = 4 実験
