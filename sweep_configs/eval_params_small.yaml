# 評価パラメータスイープ設定サンプル
#
# 訓練済みチェックポイントに対して、cfg_scaleとstepsの組み合わせで評価を実行
#
# 使用方法:
#   bash run_eval_sweep.sh sweep_configs/eval_params.yaml --ckpt logs/ckpts/best.ckpt
#

# チェックポイントパス（CLIで--ckptを指定した場合はそちらが優先）
# checkpoint: logs/ckpts/best.ckpt

# ベース実験設定
base_exp: train_musdb_controlnet_chord

# 評価パラメータ（small辞書で評価したい場合）
eval_params:
  samples: 100
  batch_size: 32
  chord_dict: small

# Hydraオーバーライド（バックボーン設定など、val_dataset.lab_dirも変更可）
hydra_overrides:
#   - "~model.chord_conditioner.backbone"
#   - "+model.chord_conditioner.backbone._target_=main.chord_backbones.ChordGRUBackbone"
  - "datamodule.val_dataset.lab_dir=/app/data/musdb_small_test"

# スイープ対象パラメータ
sweep_params:
  # cfg_scale: [3.0, 5.0, 7.0, 10.0]
  # steps: [50, 100, 150]
  cfg_scale: [7.0]
  steps: [100]
